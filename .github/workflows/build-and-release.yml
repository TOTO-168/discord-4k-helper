name: Build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vencord:
    name: Pinned Vencord + SoundCloner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read pinned build configuration
        id: config
        run: node -e 'const fs=require("fs"); const c=require("./VencordPlugin/build.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${c.vencordCommit}\n`);'
      - name: Verify platform versions and tag
        run: node scripts/verify-versions.mjs
      - uses: actions/checkout@v6
        with:
          repository: Vendicated/Vencord
          ref: ${{ steps.config.outputs.commit }}
          path: .third-party/Vencord
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Install dependencies and plugin
        run: |
          mkdir -p .third-party/Vencord/src/userplugins
          cp -R VencordPlugin/SoundCloner .third-party/Vencord/src/userplugins/
          pnpm --dir .third-party/Vencord install --frozen-lockfile
      - name: Test plugin and TypeScript
        run: |
          node --test scripts/soundcloner.test.mjs
          pnpm --dir .third-party/Vencord testTsc
          pnpm --dir .third-party/Vencord exec eslint src/userplugins/SoundCloner/index.tsx --rule 'simple-header/header: off'
      - name: Build managed Vencord and GPL source package
        run: |
          SOURCE_DATE_EPOCH="$(git -C .third-party/Vencord show -s --format=%ct)000" pnpm --dir .third-party/Vencord build --standalone --disable-updater
          node scripts/create-vencord-package.mjs .third-party/Vencord release-assets
          node scripts/verify-vencord-package.mjs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-vencord
          path: release-assets/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: vencord
    runs-on: macos-latest
    steps:
      - name: Check out helper
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: release-vencord
          path: plugin-assets

      - name: Test and package helper
        run: ./scripts/build-app.sh
        env:
          SOUNDCLONER_PACKAGE: ${{ github.workspace }}/plugin-assets/Vencord-SoundCloner.zip

      - name: Check out official Vencord Installer source
        uses: actions/checkout@v6
        with:
          repository: Vencord/Installer
          ref: 6f2ce070f5ea8c27eaa8177e2825dd39def23fa5
          path: .third-party/VencordInstaller

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .third-party/VencordInstaller/go.mod
          cache-dependency-path: .third-party/VencordInstaller/go.sum

      - name: Build official Vencord command-line installer
        working-directory: .third-party/VencordInstaller
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p ../../release-assets
          cp ../../third_party/vencord_darwin_cli_compat.go ./vencord_darwin_cli_compat.go
          go build -tags cli -trimpath -ldflags="-s -w" -o ../../release-assets/VencordInstallerCli-macOS-arm64 .
          codesign --force --sign - ../../release-assets/VencordInstallerCli-macOS-arm64
          cp LICENSE ../../release-assets/VencordInstaller-LICENSE.txt
          cp ../../dist/Discord-4K-Helper-macOS-arm64.zip ../../release-assets/

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: vencord
    runs-on: windows-latest
    steps:
      - name: Check out helper
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          name: release-vencord
          path: plugin-assets

      - name: Publish single-file app
        shell: pwsh
        run: |
          dotnet publish Windows/Discord4KHelper.Windows/Discord4KHelper.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            --output release-assets

      - name: Run Windows self-test
        shell: pwsh
        run: |
          $env:SOUNDCLONER_PACKAGE = Join-Path $pwd 'plugin-assets/Vencord-SoundCloner.zip'
          $env:SELF_TEST_LOG = Join-Path $pwd 'windows-self-test.log'
          $process = Start-Process -FilePath .\release-assets\Discord-4K-Helper-Windows-x64.exe -ArgumentList '--self-test' -Wait -PassThru
          if (Test-Path $env:SELF_TEST_LOG) { Get-Content $env:SELF_TEST_LOG }
          if ($process.ExitCode -ne 0) { throw "Windows self-test failed: $($process.ExitCode)" }

      - name: Upload Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/Discord-4K-Helper-Windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vencord, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download macOS assets
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: release-assets

      - name: Download Windows asset
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-assets

      - name: Download Vencord plugin and GPL source assets
        uses: actions/download-artifact@v8
        with:
          name: release-vencord
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Discord 4K Helper $TAG" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes
